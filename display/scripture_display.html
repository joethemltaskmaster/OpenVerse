<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenVerse — Scripture Display</title>
<style>
  :root {
    --bg: #0b0d10;
    --text: #f4f1ea;
    --accent: #d8c48a;
    --dim: #8a9099;
    --real: #6fbf73;
    --estimated: #d8a34e;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
  }

  /* -- top-left logo. Sized by viewport height so it scales between a
     laptop preview and a large projector without a media query. Max
     height is capped at 56px so it stays discreet on big screens. -- */
  #logo {
    position: fixed;
    top: 18px;
    left: 18px;
    height: clamp(73px, 5vh, 100px);
    width: auto;
    opacity: 0.9;
    pointer-events: none;   /* never intercept clicks meant for the page */
    z-index: 5;
    user-select: none;
  }
  #logo.hidden { display: none; }

  /* -- presentation stage -- */
  #stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    /* top padding reserves a clear corridor for the logo (18px offset
       + up to 56px logo + 10px breathing room = 84px floor) so a long
       reference line on a short viewport still can't collide with it */
    padding: max(6vh, 84px) 8vw 6vh;
  }
  #reference {
    font-size: clamp(1.4rem, 3vw, 2.4rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2.2rem;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #verse-text {
    font-size: clamp(1.6rem, 4.2vw, 3.4rem);
    line-height: 1.5;
    max-width: 46ch;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #stage.visible #reference,
  #stage.visible #verse-text { opacity: 1; transform: translateY(0); }

  #placeholder {
    color: var(--dim);
    font-family: -apple-system, Segoe UI, sans-serif;
    font-size: 1.1rem;
  }

  /* small, non-distracting timing indicator */
  #timing-dot {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--dim);
    opacity: 0.6;
  }
  #timing-dot.real { background: var(--real); }
  #timing-dot.estimated { background: var(--estimated); }

  /* -- control bar: hidden until hovered near the bottom -- */
  #controls {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 14px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    font-family: -apple-system, Segoe UI, sans-serif;
    font-size: 0.85rem;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.2));
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }
  #hover-zone {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 70px;
  }
  #hover-zone:hover ~ #controls,
  #controls:hover {
    transform: translateY(0);
  }
  #controls button, #controls label {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
  #controls button:disabled { opacity: 0.4; cursor: default; }
  #controls input[type=file] { display: none; }
  #status { color: var(--dim); margin-left: auto; }

  #controls .nav-group {
    display: flex;
    gap: 6px;
    padding-left: 4px;
    border-left: 1px solid rgba(255,255,255,0.15);
    margin-left: 4px;
  }
</style>
</head>
<body>

  <!-- Top-left logo. Adjust src if your file has a different name or
       extension. If the file is missing, the onerror handler below
       hides the broken-image glyph so nothing ugly hits the projector. -->
  <img id="logo"
       src="C:\Users\Joseph\Desktop\OpenVerse\cac_logo.jpg"
       alt=""
       onerror="this.classList.add('hidden')">

  <div id="timing-dot" title="real vs estimated timing"></div>

  <div id="stage">
    <div id="placeholder">Load a VerseEvent JSON file to begin — controls at the bottom of the screen.</div>
    <div id="reference"></div>
    <div id="verse-text"></div>
  </div>

  <div id="hover-zone"></div>
  <div id="controls">
    <label for="file-input">Load events…</label>
    <input id="file-input" type="file" accept="application/json">
    <button id="start-btn" disabled>Start</button>
    <button id="pause-btn" disabled>Pause</button>
    <span class="nav-group">
      <button id="prev-btn" disabled title="Previous verse (← arrow)">◀ Prev</button>
      <button id="next-btn" disabled title="Next verse (→ arrow)">Next ▶</button>
    </span>
    <button id="restart-btn" disabled>Restart</button>
    <span id="status">No file loaded</span>
  </div>

<script>
/*
 * PRESENTATION LAYER ONLY.
 * Given a list of VerseEvent objects, show the right one at the right time.
 * Expected input:
 *   { "verse_events": [ {book, chapter, verse, text, display_at, timing_source}, ... ] }
 *   or a bare array of the same objects.
 */

const stage = document.getElementById('stage');
const referenceEl = document.getElementById('reference');
const verseTextEl = document.getElementById('verse-text');
const placeholderEl = document.getElementById('placeholder');
const timingDot = document.getElementById('timing-dot');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start-btn');
const pauseBtn = document.getElementById('pause-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const restartBtn = document.getElementById('restart-btn');
const fileInput = document.getElementById('file-input');

let events = [];
let playing = false;
let startWallClock = null;
let pausedElapsed = 0;
let currentIndex = -1;
let rafHandle = null;

function bookTitle(book) {
  return book.replace(/\b\w/g, c => c.toUpperCase());
}

function loadEvents(parsed) {
  if (!referenceEl || !verseTextEl) {
    throw new Error(
      "Stage elements missing — #reference or #verse-text not found in the page."
    );
  }

  const raw = Array.isArray(parsed && parsed.verse_events) ? parsed.verse_events
            : Array.isArray(parsed) ? parsed
            : null;
  if (!raw) {
    throw new Error("No 'verse_events' array found in this file.");
  }
  if (raw.length && (raw[0].display_at === undefined || raw[0].text === undefined)) {
    throw new Error(
      "This looks like a 'references' export, not verse events. " +
      "Regenerate with: cli.py ... --with-text --json out.json"
    );
  }
  events = raw.slice().sort((a, b) => a.display_at - b.display_at);
  currentIndex = -1;
  pausedElapsed = 0;
  playing = false;
  placeholderEl.style.display = events.length ? 'none' : 'block';
  stage.classList.remove('visible');
  statusEl.textContent = `${events.length} verse event(s) loaded`;
  startBtn.disabled = events.length === 0;
  pauseBtn.disabled = true;
  restartBtn.disabled = events.length === 0;
  updateNavButtons();
}

function showEvent(ev) {
  referenceEl.textContent = `${bookTitle(ev.book)} ${ev.chapter}:${ev.verse}`;
  verseTextEl.textContent = ev.text;
  timingDot.className = ev.timing_source === 'real' ? 'real'
                       : ev.timing_source === 'estimated' ? 'estimated' : '';
  stage.classList.remove('visible');
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.add('visible')));
}

function elapsedSeconds() {
  if (!playing) return pausedElapsed;
  return pausedElapsed + (performance.now() - startWallClock) / 1000;
}

function updateNavButtons() {
  if (events.length === 0) {
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    return;
  }
  prevBtn.disabled = currentIndex <= 0;
  nextBtn.disabled = currentIndex >= events.length - 1;
}

function seekToVerse(index) {
  if (index < 0 || index >= events.length) return;

  cancelAnimationFrame(rafHandle);

  const targetTime = events[index].display_at;
  pausedElapsed = targetTime;
  if (playing) {
    startWallClock = performance.now();
  }

  currentIndex = index;
  showEvent(events[index]);
  statusEl.textContent = `Verse ${index + 1} of ${events.length}`;
  updateNavButtons();

  if (playing) {
    rafHandle = requestAnimationFrame(tick);
  }
}

function prevVerse() {
  if (currentIndex <= 0) return;
  seekToVerse(currentIndex - 1);
}

function nextVerse() {
  const target = currentIndex + 1;
  if (target >= events.length) return;
  seekToVerse(target);
}

function tick() {
  if (!playing) return;
  const elapsed = elapsedSeconds();

  let next = currentIndex;
  while (next + 1 < events.length && events[next + 1].display_at <= elapsed) {
    next += 1;
  }
  if (next !== currentIndex) {
    currentIndex = next;
    showEvent(events[currentIndex]);
    statusEl.textContent = `Verse ${currentIndex + 1} of ${events.length}`;
    updateNavButtons();
  } else if (currentIndex + 1 < events.length) {
    const remaining = (events[currentIndex + 1].display_at - elapsed).toFixed(1);
    statusEl.textContent = `Waiting — next verse in ${remaining}s`;
  }

  if (currentIndex >= events.length - 1) {
    playing = false;
    pauseBtn.disabled = true;
    startBtn.disabled = true;
    updateNavButtons();
    return;
  }
  rafHandle = requestAnimationFrame(tick);
}

function start() {
  if (playing || events.length === 0) return;
  playing = true;
  startWallClock = performance.now();
  startBtn.disabled = true;
  pauseBtn.disabled = false;
  rafHandle = requestAnimationFrame(tick);
}

function pause() {
  if (!playing) return;
  pausedElapsed = elapsedSeconds();
  playing = false;
  cancelAnimationFrame(rafHandle);
  startBtn.disabled = false;
  pauseBtn.disabled = true;
}

function restart() {
  cancelAnimationFrame(rafHandle);
  playing = false;
  pausedElapsed = 0;
  currentIndex = -1;
  stage.classList.remove('visible');
  placeholderEl.style.display = 'none';
  startBtn.disabled = events.length === 0;
  pauseBtn.disabled = true;
  statusEl.textContent = `${events.length} verse event(s) loaded`;
  updateNavButtons();
}

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      loadEvents(JSON.parse(reader.result));
    } catch (e) {
      statusEl.textContent = `Could not read file: ${e.message}`;
    }
  };
  reader.readAsText(file);
});

startBtn.addEventListener('click', start);
pauseBtn.addEventListener('click', pause);
prevBtn.addEventListener('click', prevVerse);
nextBtn.addEventListener('click', nextVerse);
restartBtn.addEventListener('click', restart);

document.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); prevVerse(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextVerse(); }
});
</script>
</body>
</html>
