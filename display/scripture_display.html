<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenVerse — Scripture Display</title>
<style>
  :root {
    --bg: #0b0d10;
    --text: #f4f1ea;
    --accent: #d8c48a;
    --dim: #8a9099;
    --real: #6fbf73;
    --estimated: #d8a34e;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    overflow: hidden;
  }

  /* -- presentation stage -- */
  #stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 8vw;
  }
  #reference {
    font-size: clamp(1.4rem, 3vw, 2.4rem);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 2.2rem;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #verse-text {
    font-size: clamp(1.6rem, 4.2vw, 3.4rem);
    line-height: 1.5;
    max-width: 46ch;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #stage.visible #reference,
  #stage.visible #verse-text { opacity: 1; transform: translateY(0); }

  #placeholder {
    color: var(--dim);
    font-family: -apple-system, Segoe UI, sans-serif;
    font-size: 1.1rem;
  }

  /* small, non-distracting timing indicator */
  #timing-dot {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--dim);
    opacity: 0.6;
  }
  #timing-dot.real { background: var(--real); }
  #timing-dot.estimated { background: var(--estimated); }

  /* -- control bar: hidden until hovered near the bottom, keeps the
     presentation screen clean the rest of the time -- */
  #controls {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 14px 20px;
    display: flex;
    gap: 12px;
    align-items: center;
    font-family: -apple-system, Segoe UI, sans-serif;
    font-size: 0.85rem;
    background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.2));
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }
  #hover-zone {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 70px;
  }
  #hover-zone:hover ~ #controls,
  #controls:hover {
    transform: translateY(0);
  }
  #controls button, #controls label {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px 12px;
    border-radius: 5px;
    cursor: pointer;
  }
  #controls button:disabled { opacity: 0.4; cursor: default; }
  #controls input[type=file] { display: none; }
  #status { color: var(--dim); margin-left: auto; }
</style>
</head>
<body>

  <div id="timing-dot" title="real vs estimated timing"></div>

  <div id="stage">
    <div id="placeholder">Load a VerseEvent JSON file to begin — controls at the bottom of the screen.</div>
    <div id="reference"></div>
    <div id="verse-text"></div>
  </div>

  <div id="hover-zone"></div>
  <div id="controls">
    <label for="file-input">Load events…</label>
    <input id="file-input" type="file" accept="application/json">
    <button id="start-btn" disabled>Start</button>
    <button id="pause-btn" disabled>Pause</button>
    <button id="restart-btn" disabled>Restart</button>
    <span id="status">No file loaded</span>
  </div>

<script>
/*
 * This file is a PRESENTATION LAYER ONLY.
 * It does not detect scripture, look up verse text, or compute timing —
 * all of that already happened upstream (ScriptureDetector, VersionLookup,
 * VersePresenter). This page's only job is: given a list of VerseEvent
 * objects, show the right one at the right time.
 *
 * Expected input shape (either is accepted):
 *   { "verse_events": [ {book, chapter, verse, text, display_at, timing_source}, ... ] }
 *   [ {book, chapter, verse, text, display_at, timing_source}, ... ]
 */

const stage = document.getElementById('stage');
const referenceEl = document.getElementById('reference');
const verseTextEl = document.getElementById('verse-text');
const placeholderEl = document.getElementById('placeholder');
const timingDot = document.getElementById('timing-dot');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start-btn');
const pauseBtn = document.getElementById('pause-btn');
const restartBtn = document.getElementById('restart-btn');
const fileInput = document.getElementById('file-input');

let events = [];       // sorted VerseEvent list
let playing = false;
let startWallClock = null;   // performance.now() when playback started
let pausedElapsed = 0;       // elapsed seconds banked across pauses
let currentIndex = -1;
let rafHandle = null;

function bookTitle(book) {
  // canonical names from bible_books.py are lowercase ("1 john",
  // "song of solomon"); title-case each word for display only —
  // this is purely cosmetic, not a second naming system.
  return book.replace(/\b\w/g, c => c.toUpperCase());
}

function loadEvents(parsed) {
  // Fail loudly here if the stage elements are missing, rather than
  // silently at play time inside the RAF loop (where an exception kills
  // the loop and nothing renders).
  if (!referenceEl || !verseTextEl) {
    throw new Error(
      "Stage elements missing — #reference or #verse-text not found in the page."
    );
  }

  const raw = Array.isArray(parsed && parsed.verse_events) ? parsed.verse_events
            : Array.isArray(parsed) ? parsed
            : null;
  if (!raw) {
    throw new Error("No 'verse_events' array found in this file.");
  }
  if (raw.length && (raw[0].display_at === undefined || raw[0].text === undefined)) {
    throw new Error(
      "This looks like a 'references' export, not verse events. " +
      "Regenerate with: cli.py ... --with-text --json out.json"
    );
  }
  events = raw.slice().sort((a, b) => a.display_at - b.display_at);
  currentIndex = -1;
  pausedElapsed = 0;
  playing = false;
  placeholderEl.style.display = events.length ? 'none' : 'block';
  stage.classList.remove('visible');
  statusEl.textContent = `${events.length} verse event(s) loaded`;
  startBtn.disabled = events.length === 0;
  pauseBtn.disabled = true;
  restartBtn.disabled = events.length === 0;
}

function showEvent(ev) {
  referenceEl.textContent = `${bookTitle(ev.book)} ${ev.chapter}:${ev.verse}`;
  verseTextEl.textContent = ev.text;
  timingDot.className = ev.timing_source === 'real' ? 'real'
                       : ev.timing_source === 'estimated' ? 'estimated' : '';
  stage.classList.remove('visible');
  // brief pause so the fade-out/fade-in reads as a transition, not a snap
  requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.add('visible')));
}

function elapsedSeconds() {
  if (!playing) return pausedElapsed;
  return pausedElapsed + (performance.now() - startWallClock) / 1000;
}

function tick() {
  if (!playing) return;
  const elapsed = elapsedSeconds();

  // advance to the latest event whose display_at has arrived
  let next = currentIndex;
  while (next + 1 < events.length && events[next + 1].display_at <= elapsed) {
    next += 1;
  }
  if (next !== currentIndex) {
    currentIndex = next;
    showEvent(events[currentIndex]);
    statusEl.textContent = `Verse ${currentIndex + 1} of ${events.length}`;
  } else if (currentIndex + 1 < events.length) {
    // nothing shown yet (or between verses) — make the wait visible so a
    // long gap before the first real timestamp never looks like "stuck"
    const remaining = (events[currentIndex + 1].display_at - elapsed).toFixed(1);
    statusEl.textContent = `Waiting — next verse in ${remaining}s`;
  }

  if (currentIndex >= events.length - 1) {
    // last event shown — nothing left to schedule, stop the loop
    playing = false;
    pauseBtn.disabled = true;
    startBtn.disabled = true;
    return;
  }
  rafHandle = requestAnimationFrame(tick);
}

function start() {
  if (playing || events.length === 0) return;
  playing = true;
  startWallClock = performance.now();
  startBtn.disabled = true;
  pauseBtn.disabled = false;
  rafHandle = requestAnimationFrame(tick);
}

function pause() {
  if (!playing) return;
  pausedElapsed = elapsedSeconds();
  playing = false;
  cancelAnimationFrame(rafHandle);
  startBtn.disabled = false;
  pauseBtn.disabled = true;
}

function restart() {
  cancelAnimationFrame(rafHandle);
  playing = false;
  pausedElapsed = 0;
  currentIndex = -1;
  stage.classList.remove('visible');
  placeholderEl.style.display = 'none';
  startBtn.disabled = events.length === 0;
  pauseBtn.disabled = true;
  statusEl.textContent = `${events.length} verse event(s) loaded`;
}

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      loadEvents(JSON.parse(reader.result));
    } catch (e) {
      statusEl.textContent = `Could not read file: ${e.message}`;
    }
  };
  reader.readAsText(file);
});

startBtn.addEventListener('click', start);
pauseBtn.addEventListener('click', pause);
restartBtn.addEventListener('click', restart);
</script>
</body>
</html>
